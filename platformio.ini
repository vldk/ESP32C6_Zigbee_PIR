; ESP32-C6 Zigbee battery PIR presence sensor - native ESP-IDF port.
;
; The Arduino sketch (docs/esp32c6_AM312_pullup_v3_2.ino) restarted the MCU on
; every motion event via deep sleep. This port keeps the radio joined and uses
; the esp-zigbee sleep feature (automatic light sleep) instead, so reports go
; out in milliseconds instead of after a full boot + rejoin.

[env:seeed_xiao_esp32c6]
platform  = espressif32
board     = seeed_xiao_esp32c6
framework = espidf

; PlatformIO generates the partition table itself and ignores
; CONFIG_PARTITION_TABLE_CUSTOM_FILENAME, so the same file has to be named here
; too - without it the build silently falls back to the single-app table and
; the Zigbee stack loses its zb_storage/zb_fct partitions.
board_build.partitions = partitions.csv

monitor_speed   = 115200
monitor_filters = esp_idf_exception_decoder, time
monitor_rts     = 0
monitor_dtr     = 0

; The device is a Zigbee End Device with the native 802.15.4 radio; the actual
; stack/PM options live in sdkconfig.defaults so menuconfig stays authoritative.
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
